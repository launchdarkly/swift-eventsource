name: Build Documentation
description: 'Build Documentation.'

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
      with:
        ruby-version: '3.1'

    # mustache 1.1.3 is incompatible with jazzy (it calls .map on the Pathname
    # jazzy passes as template_path); preinstalling 1.1.2 satisfies jazzy's
    # ~> 1.1 requirement so the broken version is never resolved.
    - name: Install jazzy gem
      shell: bash
      run: |
        gem install mustache -v 1.1.2
        gem install jazzy

    - name: Build Documentation
      shell: bash
      run: jazzy -o docs

    - name: Validate coverage
      shell: bash
      run: |
        FULLDOC=`jq '.warnings | length == 0' docs/undocumented.json`
        [ $FULLDOC == "true" ]
