name: Run Release Please

on:
  push:
    branches:
      - main

jobs:
  release-package:
    runs-on: ubuntu-latest

    permissions:
      contents: write # release-please creates releases and tags.
      pull-requests: write # release-please maintains the release PR.

    steps:
      # For a SwiftPM-only package, a release is just a git tag plus a GitHub
      # release. release-please maintains the release PR and, when it merges,
      # creates the tag/release that Swift Package Manager consumers resolve.
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          target-branch: ${{ github.ref_name }}
